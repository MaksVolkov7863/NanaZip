name: Build Binaries

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'Documents/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'Documents/**'
      - '**/*.md'

jobs:
  build:
    runs-on: windows-latest
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: 'recursive'
      - uses: microsoft/setup-msbuild@v3
      - name: Clear local NuGet cache (workaround for failed restores on windows-latest)
        run: dotnet nuget locals all --clear
      - name: Build
        run: MSBuild -binaryLogger:Output\BuildAllTargets.binlog -m BuildAllTargets.proj
      - name: Add Classic File Manager to portable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $copied = 0
          foreach ($arch in 'x64','arm64') {
            $plat = if ($arch -eq 'arm64') { 'ARM64' } else { 'x64' }
            $candidates = @(
              "Output/Binaries/Release/$plat/NanaZip.exe",
              "Output/Binaries/Release/$arch/NanaZip.exe",
              "Output/Binaries/Release/NanaZipPackage/$arch/NanaZip.exe"
            )
            $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $exe) {
              $found = Get-ChildItem -Path Output -Recurse -Filter NanaZip.exe -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match "[\\/]$plat[\\/]|[\\/]$arch[\\/]" -and $_.Name -eq 'NanaZip.exe' } |
                Select-Object -First 1
              if ($found) { $exe = $found.FullName }
            }
            if (-not $exe) {
              Write-Warning "NanaZip.exe not found for $arch"
              continue
            }
            $dest = "Output/Binaries/Root/Binaries/$arch"
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Copy-Item $exe (Join-Path $dest 'NanaZip.exe') -Force
            $pdb = [System.IO.Path]::ChangeExtension($exe, '.pdb')
            if (Test-Path $pdb) {
              $sym = "Output/Binaries/Root/Symbols/$arch"
              New-Item -ItemType Directory -Force -Path $sym | Out-Null
              Copy-Item $pdb (Join-Path $sym 'NanaZip.pdb') -Force
            }
            Write-Host "Copied $exe -> $dest\NanaZip.exe"
            $copied++
          }
          if ($copied -lt 1) { throw 'Classic NanaZip.exe was not produced; portable would still have no file manager.' }
          Get-ChildItem Output/Binaries/Root/Binaries -Recurse -Filter *.exe | ForEach-Object { $_.FullName }
      - name: Upload MSIX Bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: NanaZip_Mainline_ApplicationPackages
          path: Output/Binaries/AppPackages
      - name: Upload Extension Package Installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: NanaZip_Mainline_ExtensionPackageInstaller
          path: Output/NanaZip.ExtensionPackage_*.exe
      - name: Upload MSBuild Build Process Binary Log
        uses: actions/upload-artifact@v7.0.1
        if: "!cancelled()"
        with:
          name: NanaZip_Mainline_BuildBinaryLog
          path: Output/BuildAllTargets.binlog
      - name: Upload Portable Binaries
        uses: actions/upload-artifact@v7.0.1
        with:
          name: NanaZip_Mainline_PortableBinaries
          path: Output/Binaries/Root/Binaries
      - name: Upload Debug Symbols
        uses: actions/upload-artifact@v7.0.1
        with:
          name: NanaZip_Mainline_DebugSymbols
          path: Output/Binaries/Root/Symbols
  test-x64:
    runs-on: windows-latest
    needs:
      - build
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: M2Team/K7Tests
      - uses: actions/download-artifact@v8.0.1
        name: NanaZip_Mainline_PortableBinaries
      - run: Install-Module -Name Pester -Scope CurrentUser -MinimumVersion 5.0.0 -Force
      - run: |
          .\run.ps1 `
            -Program .\NanaZip_Mainline_PortableBinaries\x64\NanaZip.Universal.Console.exe `
            -Verbosity Detailed `
            -Verbose
  test-arm64:
    runs-on: windows-11-arm
    needs:
      - build
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: M2Team/K7Tests
      - uses: actions/download-artifact@v8.0.1
        name: NanaZip_Mainline_PortableBinaries
      - run: Install-Module -Name Pester -Scope CurrentUser -MinimumVersion 5.0.0 -Force
      - run: |
          .\run.ps1 `
            -Program .\NanaZip_Mainline_PortableBinaries\arm64\NanaZip.Universal.Console.exe `
            -Verbosity Detailed `
            -Verbose
